    <!-- Inline Critical CSS (Above the Fold) - Optimized -->
    <style>
      /* CSS Variables */
      :root {
        --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --primary: #9333ea;
        --secondary: #ec4899;
        --bg-dark: #050507;
      }
      
      /* Critical CSS - Performance First */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      body {
        font-family: var(--font-body);
        background: var(--bg-dark);
        color: #ffffff;
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* Reserve space for fixed mobile CTA bar to prevent CLS */
      @media (max-width: 767px) {
        body { padding-bottom: 56px; }
      }
      
      /* Prevent FOUT & CLS */
      .font-display {
        font-family: var(--font-sans);
        font-display: swap;
      }
      
      /* Root container optimization */
      #root {
        min-height: 100vh;
        isolation: isolate;
      }
      
      /* Image optimization - prevent CLS */
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      
      /* Critical navigation - prevent CLS */
      nav {
        position: relative;
        z-index: 50;
        contain: layout;
      }
      
      /* Hero section optimization */
      .hero-section {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        contain: layout style paint;
      }
      
      /* Layout container - prevent CLS */
      .layout-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      
      /* Loading spinner */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .spinner {
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: var(--primary);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
      }
    </style>
